<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comma Separator Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Comma-Separating Tool</h1>
        <p>Enter your text (words separated by spaces, tabs, or new lines) in the box below and click 'Separate'. The comma-separated version will appear in the box at the bottom.</p>
        <textarea id="inputText" placeholder="Enter text here..."></textarea>
        <button id="separateButton">Separate</button>
        <textarea id="outputText" readonly placeholder="Result..."></textarea>
    </div>
    <script src="script.js"></script>
</body>
</html>
