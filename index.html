<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comma Separating Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Comma Separating Tool</h1>
    <textarea id="inputText" placeholder="Paste your text here"></textarea>
    <div class="button-container">
        <button id="separateButton">Separate with Commas</button>
        <button id="removeDuplicatesButton">Remove Duplicates</button>
    </div>
    <textarea id="outputText" placeholder="Result will appear here" readonly></textarea>
    <div id="wordCount">Word count: 0</div>
    <script src="script.js"></script>
</body>
</html>
